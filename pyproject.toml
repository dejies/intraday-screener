# Install for development (editable: config.py finds data/, static/ and the CSV files next to it):
#   python3 -m venv .venv && .venv/bin/pip install -e ".[test]"
# requirements.txt lists the same dependencies for a plain `pip install -r requirements.txt`.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-screener"
version = "1.0.0"
description = "Learning project: NSE intraday momentum / relative-strength scanner on the Dhan API (read-only, never places orders)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "fastapi>=0.115,<0.129",
    "uvicorn>=0.30,<0.40",
    "requests>=2.31",
    "websocket-client>=1.7,<2",
    "websockets>=12,<14",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[project.scripts]
screener = "app:main"
screener-history = "history:main"
screener-backtest = "backtest:main"
screener-universe = "universe:main"
screener-manage = "manage:main"

[tool.setuptools]
py-modules = ["app", "config", "history", "backtest", "universe", "manage"]
packages = ["screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
